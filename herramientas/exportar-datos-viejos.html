<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exportar datos viejos</title>
  <style>
    :root { --bg: #DFF6FB; --paper: #fff; --text: #0B0B0C; --muted: #5C6A6D; --accent: #25D6E8; --accent-2: #FF54C6; --orange: #FF8A3D; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .card { width: 100%; max-width: 520px; background: var(--paper); border: 3px solid var(--text); border-radius: 18px; box-shadow: 8px 8px 0 var(--text); padding: 28px 24px; }
    h1 { font-size: 24px; text-transform: uppercase; margin-bottom: 12px; }
    p { font-weight: 600; line-height: 1.5; margin-bottom: 14px; }
    .muted { color: var(--muted); font-size: 14px; }
    .count { font-size: 44px; font-weight: 900; color: var(--accent-2); }
    button { width: 100%; height: 52px; border-radius: 999px; border: 3px solid var(--text); background: var(--accent-2); color: #fff; font-weight: 900; font-size: 16px; text-transform: uppercase; box-shadow: 4px 4px 0 var(--text); cursor: pointer; }
    button:active { transform: translate(3px,3px); box-shadow: none; }
    .err { background: var(--orange); border: 2.5px solid var(--text); border-radius: 12px; padding: 12px 14px; }
    ul { margin: 0 0 16px 20px; font-size: 14px; font-weight: 600; max-height: 180px; overflow: auto; }
  </style>
</head>
<body>
  <div class="card" id="out"></div>
  <script>
    // Lee la lista guardada por "Videojuegos completados (para enviar).html" (localStorage de file://)
    // y la descarga como JSON para importarla en la versión online (menú de usuario > Importar).
    const out = document.getElementById('out');
    let raw = null;
    try { raw = localStorage.getItem('vj_completados_v1'); } catch (e) { /* bloqueado */ }
    let games = [];
    try { games = raw ? JSON.parse(raw) : []; } catch (e) { games = []; }

    if (!games.length) {
      out.innerHTML = `
        <h1>No encontré juegos</h1>
        <p class="err">Este navegador no tiene guardada la lista de la versión anterior.</p>
        <p class="muted">Copia este archivo a la misma carpeta que <b>Videojuegos completados (para enviar).html</b> y ábrelo con el <b>mismo navegador</b> que usabas (doble clic).</p>`;
    } else {
      const withUpload = games.filter(g => String(g.cover || '').startsWith('data:')).length;
      out.innerHTML = `
        <h1>Tus juegos</h1>
        <div class="count">${games.length}</div>
        <p class="muted">juegos encontrados${withUpload ? ` · ${withUpload} con carátula subida` : ''}</p>
        <ul>${games.slice(0, 50).map(g => `<li>${String(g.title || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</li>`).join('')}${games.length > 50 ? '<li>…</li>' : ''}</ul>
        <button id="dl">Descargar .json</button>
        <p class="muted" style="margin-top:14px;margin-bottom:0">Después, en la web nueva: tu avatar (arriba a la derecha) → <b>Importar juegos</b> y elige este archivo.</p>`;
      document.getElementById('dl').onclick = () => {
        const url = URL.createObjectURL(new Blob([JSON.stringify(games, null, 2)], { type: 'application/json' }));
        const a = document.createElement('a');
        a.href = url; a.download = 'videojuegos-version-anterior.json';
        document.body.appendChild(a); a.click(); a.remove();
      };
    }
  </script>
</body>
</html>
